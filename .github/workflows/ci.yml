name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 1 * * *' }]        # nightly full run (01:00 UTC)
  workflow_dispatch:
    inputs:
      scope:
        description: 'smoke = fast gate | full = latest dependencies | live = REAL LLM demo (uses your API key)'
        type: choice
        default: smoke
        options: [smoke, full, live]
      provider:
        description: 'live only: LLM provider'
        type: choice
        default: gemini
        options: [gemini, groq, openai]
      role:
        description: 'live only: job role for the demo'
        type: string
        default: Data Engineer

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1) Static checks + the full offline test suite on every supported Python (the tests use a fake client)
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q interview_coach tests cli.py demo.py
      - name: Lint (non-blocking until existing style issues are cleaned up)
        continue-on-error: true
        run: pip install ruff && ruff check .
      - name: Unit tests
        run: python -m pytest -q

  # 2) Fast gate on every push / PR: install ONLY the runtime requirements (no pytest) and prove the app starts
  smoke:
    needs: quality
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Package imports
        run: python -c "import interview_coach; print('import ok')"
      - name: CLI and demo start without an API key
        run: |
          python cli.py --help
          python demo.py --help

  # 3) Nightly / on demand: dependencies are unpinned (">="), so test against the NEWEST releases
  #    on the oldest and newest supported Python.
  full:
    needs: quality
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }   # no pip cache on purpose
      - run: pip install --upgrade --upgrade-strategy eager -r requirements-dev.txt
      - run: pip list
      - run: python -m pytest -q

  # 4) Manual only: a real LLM plays the candidate (see demo.py). Needs ONE repo secret:
  #    GEMINI_API_KEY, GROQ_API_KEY or OPENAI_API_KEY, matching the provider you pick.
  live:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: ${{ inputs.provider }}
      DEMO_ROLE: ${{ inputs.role }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Require the API key for the chosen provider
        run: |
          case "$LLM_PROVIDER" in
            gemini) key="$GEMINI_API_KEY"; name=GEMINI_API_KEY ;;
            groq)   key="$GROQ_API_KEY";   name=GROQ_API_KEY ;;
            openai) key="$OPENAI_API_KEY"; name=OPENAI_API_KEY ;;
          esac
          if [ -z "$key" ]; then echo "::error::Add the $name repository secret"; exit 1; fi
      - name: Run the interview demo against the real model
        run: python demo.py --role "$DEMO_ROLE" --level average -v
